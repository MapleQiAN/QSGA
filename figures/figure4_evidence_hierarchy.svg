<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="520" viewBox="0 0 1220 520" role="img" aria-labelledby="title desc">
  <title id="title">QSGA evidence hierarchy overview</title>
  <desc id="desc">Overview from natural-language intent, construction bottleneck, QYIR verification chain, direct-code comparison, and remaining gap.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#101828" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1220" height="520" fill="#f8fafc"/>
  <text x="610" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#101828">Evidence hierarchy for bounded QYIR verification</text>
  <text x="610" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475467">The paper separates front-end construction from downstream verification-chain behavior.</text>

  <g filter="url(#shadow)">
    <rect x="45" y="135" width="190" height="145" rx="10" fill="#ffffff" stroke="#98a2b3" stroke-width="1.5"/>
    <text x="140" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#101828">NL intent</text>
    <text x="140" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#344054">Chinese novice requests</text>
    <text x="140" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#344054">bounded stock/ETF rules</text>
    <text x="140" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#344054">unsafe and ambiguous cases</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="285" y="120" width="230" height="175" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="400" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#9a3412">QYIR construction</text>
    <text x="400" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7c2d12">No-oracle prototype: 0.887 E2E</text>
    <text x="400" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7c2d12">Live prompt-only construction: 0.091</text>
    <text x="400" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Main front-end bottleneck</text>
    <text x="400" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7c2d12">slot diagnostics expose weak entry/exit parsing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="565" y="105" width="250" height="205" rx="10" fill="#ecfdf3" stroke="#12b76a" stroke-width="1.5"/>
    <text x="690" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#05603a">Verification chain</text>
    <text x="690" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#065f46">schema and reference checks</text>
    <text x="690" y="193" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#065f46">semantic slots and risk audit</text>
    <text x="690" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#065f46">deterministic compile and backtest</text>
    <text x="690" y="239" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#065f46">clarify, reject, local repair</text>
    <text x="690" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#05603a">Oracle-slot upper bound: 0.963 E2E</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="865" y="120" width="230" height="175" rx="10" fill="#eff8ff" stroke="#2e90fa" stroke-width="1.5"/>
    <text x="980" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#175cd3">Direct-code diagnostic</text>
    <text x="980" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1849a9">construction success: 0.509</text>
    <text x="980" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1849a9">E2E success: 0.350</text>
    <text x="980" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#175cd3">Lower entry friction</text>
    <text x="980" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1849a9">weaker slot audit and localized repair</text>
  </g>

  <line x1="235" y1="207" x2="277" y2="207" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="515" y1="207" x2="557" y2="207" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="815" y1="207" x2="857" y2="207" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="210" y="370" width="800" height="86" rx="12" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
    <text x="610" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#101828">Remaining gap</text>
    <text x="610" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#344054">Direct code is easier to construct, whereas QYIR provides a stricter representation contract for post-construction verification and localized repair.</text>
  </g>
</svg>
