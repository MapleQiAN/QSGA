[project]
name = "qsga-system"
version = "0.1.0"
description = "QSGA: Verification-Guided Program Synthesis for Reliable Quantitative Strategy Generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "openai>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
